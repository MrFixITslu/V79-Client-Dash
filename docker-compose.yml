services:
  v79-hub:
    build: .
    container_name: v79-hub
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3040
      APP_URL: ${APP_URL:-https://hub.v79sl.com}
      DATA_DIR: /app/data
      V79_HUB_ADMIN_USERNAME: ${V79_HUB_ADMIN_USERNAME:-admin}
      V79_HUB_ADMIN_PASSWORD: ${V79_HUB_ADMIN_PASSWORD:?Set a unique 16+ character admin password}
      V79_HUB_ADMIN_EMAIL: ${V79_HUB_ADMIN_EMAIL:-}
      V79_PLATFORM_SHARED_SECRET: ${V79_PLATFORM_SHARED_SECRET:?Set the same 32+ character secret as POS}
      POS_BASE_URL: ${POS_BASE_URL:-http://v79-commerce-api:8080}
      POS_PUBLIC_URL: ${POS_PUBLIC_URL:-https://pos.v79sl.com}
      FFPRO_PUBLIC_URL: ${FFPRO_PUBLIC_URL:-https://ffpro.v79sl.com}
      TIQUET_PUBLIC_URL: ${TIQUET_PUBLIC_URL:-https://tiquet.v79sl.com}
      MARKETING_PUBLIC_URL: ${MARKETING_PUBLIC_URL:-https://marketing.v79sl.com}
      V79_FFPRO_LAUNCH_SECRET: ${V79_FFPRO_LAUNCH_SECRET:-}
      V79_TIQUET_LAUNCH_SECRET: ${V79_TIQUET_LAUNCH_SECRET:-}
      V79_MARKETING_LAUNCH_SECRET: ${V79_MARKETING_LAUNCH_SECRET:-}
      V79_POS_ORG_ID: ${V79_POS_ORG_ID:-}
      V79_POS_OWNER_USER_ID: ${V79_POS_OWNER_USER_ID:-}
      V79_AGENT_INTERNAL_URL: ${V79_AGENT_INTERNAL_URL:-http://v79-business-agent:3055}
      V79_AGENT_API_TOKEN: ${V79_AGENT_API_TOKEN:-}
    expose:
      - "3040"
    volumes:
      - ./data:/app/data
    networks:
      - proxy_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3040/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  v79-business-agent:
    build: ./agent-service
    container_name: v79-business-agent
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3055
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-gpt-5.6-sol}
      V79_AGENT_API_TOKEN: ${V79_AGENT_API_TOKEN:-}
      V79_HUB_HEALTH_URL: http://v79-hub:3040/api/health
      V79_WEBSITE_HEALTH_URL: ${V79_WEBSITE_HEALTH_URL:-}
      V79_LASERTAG_HEALTH_URL: ${V79_LASERTAG_HEALTH_URL:-}
      V79_MARKETING_HEALTH_URL: ${V79_MARKETING_HEALTH_URL:-}
      V79_POS_HEALTH_URL: ${V79_POS_HEALTH_URL:-}
      V79_TIQUET_HEALTH_URL: ${V79_TIQUET_HEALTH_URL:-}
      V79_FFPRO_HEALTH_URL: ${V79_FFPRO_HEALTH_URL:-}
      V79_ACADEMY_HEALTH_URL: ${V79_ACADEMY_HEALTH_URL:-}
      V79_GAMES_HEALTH_URL: ${V79_GAMES_HEALTH_URL:-}
    expose:
      - "3055"
    networks:
      - proxy_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3055/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy_network:
    external: true